const WX_LIST = ['snow','leaves','sand','ember','stars','bubbles'];

const ADJ = [
'Изумрудные','Алые','Лазурные','Янтарные','Аметистовые','Нефритовые','Бирюзовые','Коралловые','Медные','Облачные',

'Далёкие','Тайные','Древние','Забытые','Зачарованные','Хрустальные','Жемчужные','Опаловые','Гранатовые','Сапфировые',
'Пепельные','Молочные','Мятные','Персиковые','Сливовые','Оливковые','Медовые','Лиловые','Нежные','Дикие',
'Спокойные','Тайфунные','Северные','Южные','Высокие','Тихие','Первые','Последние','Скрытые','Вечные'
];

function hsl(h,s,l,a){ return a ? `hsla(${h},${s}%,${l}%,${a})` : `hsl(${h},${s}%,${l}%)`; }

const THEMES = [];
for (let i=0; i<250; i++){
  const sc  = SCENES[i%10];
  const hue = Math.round((i*137.508)%360);
  const h2  = (hue+42)%360;
  const d   = sc.dark;
  const lS  = d ? 10+(i%5)*4 : 64+(i%5)*6;
  THEMES.push({
    name:    ADJ[Math.floor(i/10)%ADJ.length] + ' ' + sc.name.toLowerCase(),
    scene:   sc.name,
    pipe:    sc.pipe,
    wx:      WX_LIST[i%WX_LIST.length],
    pipeTint:hsl(hue,55,50,.26),
    skyTop:  hsl(hue, d?72:42, Math.min(88,lS+16)),
    skyBot:  hsl(h2,  d?60:38, lS),
    glow:    hsl((hue+180)%360,85,80),
    far:     hsl(hue, d?42:26, d?16:60),
    near:    hsl(hue, d?52:34, d?9:44),
    gTop:    hsl(h2,  d?36:30, d?24:66),
    gBot:    hsl(hue, d?40:32, d?15:48),
    gAcc:    hsl(hue, 45, d?30:40)
  });
}

function themeIndexOf(lvl){ return Math.floor(((lvl|0)-1)/2) % THEMES.length; }
function themeOf(lvl){ return THEMES[themeIndexOf(lvl)] || THEMES[0]; }


function levelSpeed(lvl){ return SPEEDV * (1 + Math.min((lvl-1)*0.012, 1.4)); }
function levelGap(lvl){ return Math.max(150*S, GAP * (1 - Math.min((lvl-1)*0.004, 0.4))); }
function levelSpacing(lvl){ return Math.max(170*S, 240*S - Math.min((lvl-1)*0.5*S, 70*S)); }

function mulberry(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============ Сохранение и НЕДЕЛЬНЫЙ РЕКОРД ============ */
let save;
function load(){
  try { save = JSON.parse(localStorage.getItem('tgPlaneSave3')); } catch(e){ save = null; }
  if(!save || typeof save !== 'object') save = {};

  // БЫЛО: save.coins = save.coins || 500;
  // СТАЛО: звёзды начинаются с 0, если их нет в сохранении
  save.stars = (typeof save.stars === 'number') ? save.stars : 0;

  save.best      = save.best      || 0;
  save.games     = save.games     || 0;
  save.maxLevel  = Math.max(1, Math.min(MAX_LEVEL, Math.round(save.maxLevel || 1)));

  const now = new Date();
  const currentWeek = Math.floor(now.getTime() / (1000*60*60*24*7));
  if (!save.weeklyWeek || save.weeklyWeek !== currentWeek){
    save.weeklyWeek = currentWeek;
    save.weeklyBest = 0;
  }
  if (!save.playerName) save.playerName = 'Игрок';
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user){
    const un = (tg.initDataUnsafe.user.first_name || '').trim();
    if (un) save.playerName = un.substring(0, 12);
  }
  if(!save.owned) save.owned = { classic:true, gold:false, diamond:false, cosmic:false };
  if(!save.accountResetV1){
    save.best = 0;
    save.weeklyBest = 0;
    save.stars = 0;
    save.accountResetV1 = true;
  }
  if(!SKINS[save.skin]) save.skin = 'classic';
}
function persist(){ try { localStorage.setItem('tgPlaneSave3', JSON.stringify(save)); } catch(e){} }

/* ============ Масштаб и ресайз ============ */
let bgCache = {}, pipePatterns = {}, planeCache = {}, cloudSpr = null;

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = cvs.clientWidth; H = cvs.clientHeight;
  cvs.width = Math.max(2, Math.round(W*dpr));
  cvs.height = Math.max(2, Math.round(H*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S = Math.min(H/700, W/450);
  GRAV = .5*S; FLAPV = -8.6*S; SPEEDV = 2.1*S;
  PIPE_W = 66*S; GAP = Math.min(250*S, H*.45); PLANE_R = 15*S; GROUND_H = 40*S;
  bgCache = {}; pipePatterns = {}; planeCache = {};
  cloudSpr = null; buildTiles();
}
window.addEventListener('resize', resize);
resize();

/* ============ Спрайт Самолётик: Эра приключений ============ */
function planeSprite(skinId){
  if (planeCache[skinId]) return planeCache[skinId];
  const sk = SKINS[skinId];
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const g = c.getContext('2d');
  g.scale(3,3); g.translate(30,30); g.lineJoin='round'; g.lineCap='round';
  if (sk.phase) g.globalAlpha=.72;
  // Мягкая тень под корпусом
  g.save(); g.shadowColor='rgba(0,0,0,.35)'; g.shadowBlur=5; g.shadowOffsetY=3;
  // Основной корпус с объёмным металлическим градиентом
  const body=g.createLinearGradient(0,-15,0,15);
  body.addColorStop(0,'#ffffff'); body.addColorStop(.18,sk.body); body.addColorStop(.62,sk.shade); body.addColorStop(1,'#263746');
  g.beginPath(); g.moveTo(23,0); g.lineTo(-17,-15); g.lineTo(-8,-2); g.lineTo(-18,14); g.closePath();
  g.fillStyle=body; g.fill(); g.shadowColor='transparent'; g.lineWidth=1.5; g.strokeStyle=sk.edge; g.stroke(); g.restore();
  // Верхнее и нижнее крыло с фасками
  const wing=g.createLinearGradient(-16,-12,12,9); wing.addColorStop(0,'#ffffff'); wing.addColorStop(.35,sk.body); wing.addColorStop(1,sk.shade);
  g.beginPath(); g.moveTo(8,-1); g.lineTo(-17,-15); g.lineTo(-9,-2); g.closePath(); g.fillStyle=wing; g.fill();
  g.beginPath(); g.moveTo(8,1); g.lineTo(-18,14); g.lineTo(-9,2); g.closePath(); g.fillStyle=sk.shade; g.fill();
  // Нос и центральная линия корпуса
  g.beginPath(); g.moveTo(23,0); g.lineTo(8,-1); g.lineTo(-16,-12); g.strokeStyle='rgba(255,255,255,.72)'; g.lineWidth=.9; g.stroke();
  g.beginPath(); g.moveTo(20,0); g.lineTo(-12,0); g.strokeStyle='rgba(20,35,48,.5)'; g.lineWidth=1.1; g.stroke();
  // Кабина пилота удалена: цельный металлический корпус без стеклянного фонаря.
  // Хвостовой стабилизатор
  g.beginPath(); g.moveTo(-13,0); g.lineTo(-19,-6); g.lineTo(-17,0); g.lineTo(-19,6); g.closePath();
  g.fillStyle=sk.body; g.fill(); g.strokeStyle=sk.edge; g.lineWidth=.8; g.stroke();
  if(sk.spark){ g.fillStyle='#fff'; for(const pt of [[-3,-8],[10,5],[-11,8]]){g.beginPath();g.arc(pt[0],pt[1],.9,0,Math.PI*2);g.fill();} }
  g.globalAlpha=1; planeCache[skinId]=c; return c;
}

/* ============ Облако ============ */
function buildTiles(){
  const c=document.createElement('canvas'); c.width=200; c.height=120;
  const g=c.getContext('2d');
  // Объёмное мягкое облако с теневой нижней частью
  g.save(); g.shadowColor='rgba(54,105,145,.28)'; g.shadowBlur=12; g.shadowOffsetY=5;
  const grad=g.createLinearGradient(0,24,0,112);
  grad.addColorStop(0,'#ffffff'); grad.addColorStop(.48,'#f5fbff'); grad.addColorStop(1,'#b8d2e5');
  g.fillStyle=grad; g.beginPath();
  g.moveTo(25,88); g.bezierCurveTo(8,85,10,57,31,52);
  g.bezierCurveTo(34,28,58,20,77,35); g.bezierCurveTo(91,2,139,9,145,42);
  g.bezierCurveTo(174,36,193,59,180,81); g.bezierCurveTo(175,99,154,103,133,101);
  g.lineTo(44,101); g.bezierCurveTo(33,101,27,96,25,88); g.closePath(); g.fill(); g.restore();
  const hi=g.createLinearGradient(35,25,130,70); hi.addColorStop(0,'rgba(255,255,255,.85)'); hi.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=hi; g.beginPath(); g.ellipse(83,42,45,16,-.2,0,Math.PI*2); g.fill();
  cloudSpr=c;
}
const clouds = [];
for (let i=0;i<6;i++) clouds.push({x:Math.random()*600, y:Math.random(), sp:.2+Math.random()*.4, sc:.6+Math.random()*.8});

/* ============ Текстуры баррикад (по стилю) ============ */
function pipeStyle(style){
  if (pipePatterns[style]) return pipePatterns[style];
  const tile = document.createElement('canvas');
  tile.width = Math.max(2, Math.round(PIPE_W));
  tile.height = Math.max(2, Math.round(64*S));
  const g = tile.getContext('2d');
  const w = tile.width, h = tile.height;
  let cap = '#1f9ad6', glow = null;

  const base = (c1,c2,c3) => {
    const grd = g.createLinearGradient(0,0,w,0);
    grd.addColorStop(0,c1); grd.addColorStop(.5,c2); grd.addColorStop(1,c3);
    g.fillStyle = grd; g.fillRect(0,0,w,h);
  };

  if (style === 'stone'){
    base('#b0a89c','#989084','#7e766c');
    g.strokeStyle = 'rgba(60,50,40,.45)'; g.lineWidth = Math.max(1,1.2*S);
    for (let y=0; y<h; y+=10*S){
      g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
      const off = (Math.floor(y/(10*S))%2) ? w*.3 : w*.7;
      g.beginPath(); g.moveTo(off,y); g.lineTo(off,y+10*S); g.stroke();
    }
    cap = '#8a8278';
  } else if (style === 'wood'){
    base('#a87b4e','#8f663c','#6f4e2c');
    g.strokeStyle = 'rgba(70,45,20,.5)'; g.lineWidth = Math.max(1,1.5*S);
    for (let y=6*S; y<h; y+=12*S){
      g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
    }
    g.strokeStyle = 'rgba(60,38,18,.35)'; g.lineWidth = 1;
    for (let y=0; y<h; y+=12*S){
      g.beginPath(); g.arc(w*.5, y, 4*S, 0, Math.PI); g.stroke();
    }
    cap = '#6f4e2c';
  } else if (style === 'sand'){
    base('#e8c88f','#d4aa6c','#b8905a');
    g.strokeStyle = 'rgba(140,100,55,.4)'; g.lineWidth = Math.max(1,1.5*S);
    for (let y=8*S; y<h; y+=16*S){
      g.beginPath();
      g.moveTo(0,y);
      g.quadraticCurveTo(w*.5, y+4*S, w, y);
      g.stroke();
    }
    cap = '#c49a60';
  } else if (style === 'lava'){
    base('#4a3830','#3a2a24','#281c18');
    g.strokeStyle = '#ff6a30'; g.lineWidth = Math.max(1,2*S);
    for (let y=8*S; y<h; y+=20*S){
      g.beginPath();
      g.moveTo(w*.2, y);
      g.lineTo(w*.55, y+7*S);
      g.lineTo(w*.85, y+2*S);
      g.stroke();
    }
    cap = '#2a1c16';
  } else if (style === 'city'){
    base('#5a6a7a','#48586a','#3a4858');
    g.fillStyle = 'rgba(255,220,120,.85)';
    for (let y=8*S; y<h-8*S; y+=14*S){
      for (let x=8*S; x<w-10*S; x+=18*S){
        if (Math.random() < .7) g.fillRect(x, y, 7*S, 8*S);
      }
    }
    cap = '#3a4858';
  } else if (style === 'neon'){
    base('#1a0c30','#22104a','#160a2a');
    glow = '#ff4dd8';
    g.strokeStyle = 'rgba(0,229,255,.8)'; g.lineWidth = Math.max(1,2*S);
    for (let y=10*S; y<h; y+=20*S){
      g.beginPath(); g.moveTo(3*S,y); g.lineTo(w-3*S,y); g.stroke();
    }
    cap = '#3a1560';
  } else if (style === 'laser'){
    base('#30104a','#501a80','#2a0c40');
    glow = '#c060ff';
    g.strokeStyle = 'rgba(220,120,255,.9)'; g.lineWidth = Math.max(1,2.5*S);
    g.beginPath(); g.moveTo(w*.5,0); g.lineTo(w*.5,h); g.stroke();
    g.strokeStyle = 'rgba(160,80,255,.4)'; g.lineWidth = Math.max(1,1*S);
    g.beginPath(); g.moveTo(w*.25,0); g.lineTo(w*.25,h); g.stroke();
    g.beginPath(); g.moveTo(w*.75,0); g.lineTo(w*.75,h); g.stroke();
    cap = '#5a1a90';
  } else if (style === 'ice'){
    base('#cfeafc','#a8d8f4','#8ec4e8');
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = Math.max(1,1.5*S);
    for (let y=0; y<h; y+=16*S){
      g.beginPath(); g.moveTo(0,y+16*S); g.lineTo(w*.35,y); g.stroke();
      g.beginPath(); g.moveTo(w,y+16*S); g.lineTo(w*.6,y); g.stroke();
    }
    cap = '#9ecbe8';
  } else if (style === 'coral'){
    base('#ff8a7a','#e86a68','#c84e58');
    g.fillStyle = 'rgba(255,220,180,.6)';
    for (let y=6*S; y<h; y+=14*S){
      for (let x=6*S; x<w; x+=14*S){
        g.beginPath(); g.arc(x, y, 4*S, 0, 7); g.fill();
      }
    }
    cap = '#d05a5e';
  } else { /* trunk — осенние стволы */
    base('#8a6238','#734e2a','#5c3e20');
    g.strokeStyle = 'rgba(50,32,14,.55)'; g.lineWidth = Math.max(1,2*S);
    for (let x=8*S; x<w; x+=16*S){
      g.beginPath(); g.moveTo(x,0); g.lineTo(x+2*S,h); g.stroke();
    }
    cap = '#5c3e20';
  }

  pipePatterns[style] = { pattern: ctx.createPattern(tile,'repeat'), cap, glow };
  return pipePatterns[style];
}

/* ============ Фоновые слои (параллакс) ============ */
function buildLayer(ti, li){
  const th = THEMES[ti];
  const lw = Math.max(Math.round(W + 120*S), Math.round(900*S));
  const c = document.createElement('canvas');
  c.width = lw; c.height = Math.max(2, Math.round(H));
  const g = c.getContext('2d');
  const base = H - GROUND_H;
  const col = li === 0 ? th.far : th.near;
  const rnd = mulberry(ti*97 + li*131 + 7);
  const n = th.scene;

  if (n === 'Горы'){
    g.fillStyle = col;
    let x = -40*S;
    while (x < lw){
      const w = 120*S + rnd()*180*S;
      const h = (li===0 ? 110 : 190)*S * (.55 + rnd()*.7);
      g.beginPath(); g.moveTo(x, base); g.lineTo(x+w/2, base-h); g.lineTo(x+w, base); g.closePath(); g.fill();
      if (li===0){
        g.fillStyle = 'rgba(255,255,255,.75)';
        g.beginPath();

  if (n === 'Горы' || n === 'Льды') {

      if(li===1){g.strokeStyle='rgba(48,38,25,.45)';g.lineWidth=2*S;g.beginPath();g.moveTo(x,y+r*.4);g.lineTo(x,base);g.stroke();}

    for(let i=0;i<Math.ceil(lw/(150*S));i++){

      g.strokeStyle='rgba(255,244,205,.58)';g.lineWidth=2*S;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+28*S,y-8*S,x+55*S,y+2*S);g.stroke();
      if(li===1 && rnd()>.45){g.strokeStyle='rgba(55,105,62,.8)';g.lineWidth=4*S;g.beginPath();g.moveTo(x+70*S,base);g.lineTo(x+70*S,y-14*S);g.moveTo(x+70*S,y+8*S);g.lineTo(x+60*S,y+2*S);g.moveTo(x+70*S,y+1*S);g.lineTo(x+80*S,y-5*S);g.stroke();}
    }
  } else if (n === 'Вулкан') {
    for(let i=0;i<24;i++){const x=rnd()*lw,y=base-rnd()*base*.65;g.fillStyle=i%2?'rgba(255,105,35,.18)':'rgba(25,20,20,.22)';g.beginPath();g.arc(x,y,(2+rnd()*5)*S,0,7);g.fill();}
    if(li===1){g.strokeStyle='rgba(255,91,35,.75)';g.lineWidth=2*S;for(let i=0;i<5;i++){const x=rnd()*lw;g.beginPath();g.moveTo(x,base);g.lineTo(x+8*S,base-15*S-rnd()*35*S);g.stroke();}}

function getBg(ti){

/* ============ Частицы погоды ============ */
function initWx(){
  wx = [];
  const type = THEMES[themeIdx].wx;
  const cap = 60;
  if (type === 'stars'){
    for (let i=0;i<cap;i++) wx.push({type, x:Math.random()*W, y:Math.random()*H*.75, ph:Math.random()*6, r:(1+Math.random()*1.6)*S});
  } else {
    for (let i=0;i<cap;i++) wx.push({type, x:Math.random()*W, y:Math.random()*H, ph:Math.random()*6, r:(2+Math.random()*3)*S});
  }
}
function stepWx(k){
  const type = THEMES[themeIdx].wx;
  if (type === 'stars'){
    for (const p of wx) p.ph += .05*k;
    return;
  }
  for (const p of wx){
    p.ph += .06*k;
    if (type === 'snow'){ p.x -= .5*S*k; p.y += .8*S*k; }
    else if (type === 'leaves'){ p.x -= 1.1*S*k; p.y += (0.7+Math.sin(p.ph))*S*k; }
    else if (type === 'sand'){ p.x -= 2.2*S*k; p.y += Math.sin(p.ph)*.4*S*k; }
    else if (type === 'ember'){ p.x -= .4*S*k; p.y -= 1.2*S*k; }
    else if (type === 'bubbles'){ p.y -= .9*S*k; p.x += Math.sin(p.ph)*.4*S*k; }
    if (p.y > H+10 || p.y < -10 || p.x < -20) { p.x = W + 20; p.y = type==='ember'||type==='bubbles' ? H+10 : -10; }
  }
}
function drawWx(){
  const type = THEMES[themeIdx].wx;
  for (const p of wx){
    if (type === 'stars'){
      ctx.globalAlpha = .4 + .6*Math.abs(Math.sin(p.ph));
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    } else if (type === 'snow'){
      ctx.globalAlpha = .7;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    } else if (type === 'leaves'){
      ctx.globalAlpha = .8;
      ctx.fillStyle = '#e08030';
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.ph);
      ctx.fillRect(-p.r, -p.r*.5, p.r*2, p.r);
      ctx.restore();
    } else if (type === 'sand'){
      ctx.globalAlpha = .35;
      ctx.fillStyle = '#f0d8a8';
      ctx.fillRect(p.x, p.y, p.r*3, p.r*.6);
    } else if (type === 'ember'){
      ctx.globalAlpha = .5 + .5*Math.abs(Math.sin(p.ph));
      ctx.fillStyle = '#ff8a50';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*.7, 0, 7); ctx.fill();
    } else if (type === 'bubbles'){
      ctx.globalAlpha = .4;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5*S;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function drawFx(){
  for (let i=fx.length-1; i>=0; i--){
    const p = fx[i];
    p.x += p.vx*k_last; p.y += p.vy*k_last;
    p.vy += .04*S*k_last;
    p.life -= k_last;
    if (p.life <= 0){ fx.splice(i,1); continue; }
    const a = Math.max(0, p.life/p.max);
    ctx.globalAlpha = a;
    if (p.type === 'circle'){
      ctx.fillStyle = 'rgb(' + p.col + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(.5+a*.7), 0, 7); ctx.fill();
    } else if (p.type === 'star4'){
      ctx.fillStyle = 'rgb(' + p.col + ')';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y-p.r); ctx.lineTo(p.x+p.r*.5, p.y);
      ctx.lineTo(p.x, p.y+p.r); ctx.lineTo(p.x-p.r*.5, p.y);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = 'rgb(' + p.col + ')';
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.life*.2);
      ctx.fillRect(-p.r*.4, -p.r, p.r*.8, p.r*2);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

  score = startScore;
  shopEligibleScore = 0;

  pipes = []; hazards = []; collectibles = []; pipeCount = 0; hazardTimer = 260; fx = []; spawnTimer = 0; shieldT = 0; shieldUsed = false;
  phaseT = 0; phaseUsed = false; luckyUsed = false;

  state = 'play';
}

  plane.vy = FLAPV; haptic('light');
}

      else tg.expand();

    }

function buySkin(id){
  if (save.owned[id]) { 
    save.skin = id; 
    persist(); 
    haptic('light'); 
    return; 
  }

  // БЫЛО: if (save.coins >= SKINS[id].price)
  // СТАЛО:
  if (save.stars >= SKINS[id].price){
    save.stars -= SKINS[id].price; 
    save.owned[id] = true; 
    save.skin = id;
    persist(); 
    haptic('medium');
  } else {
    haptic('rigid'); // вибрация «недостаточно валюты»
  }
}

function changePlayerName(){
  const nn = prompt(translateText('Ваше имя (до 12 символов):'), save.playerName);
  if (nn && nn.trim()){
    save.playerName = nn.trim().substring(0, 12);
    persist(); haptic('light');
  }
}

cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cvs.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  for (const b of uiButtons){
    if (x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h){ b.action(); return; }
  }
  if (state === 'play') flap();
});
window.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.code !== 'ArrowUp') return;
  e.preventDefault();
  if (e.repeat) return;
  if (state === 'play') flap();
  else if (state === 'menu') showBriefing(1);
  else if (state === 'briefing') return;
  else if (state === 'over' && performance.now()-overTime > 600) startGame(lastStart);
  else if (state === 'pause') state = 'play';
  else if (state === 'shop' || state === 'levels' || state === 'records' || state === 'topup') toMenu();
});


/* ============ Логика ============ */
let k_last = 1;

function rectHit(rx, ry, rw, rh){
  const cx = Math.max(rx, Math.min(plane.x, rx+rw));
  const cy = Math.max(ry, Math.min(plane.y, ry+rh));
  const dx = plane.x-cx, dy = plane.y-cy;
  return dx*dx + dy*dy < PLANE_R*PLANE_R;
}
function spawnPipe(lvl){
  const gap = levelGap(lvl);
  const margin = 60*S;
  const gapY = margin + gap/2 + Math.random()*(H - gap - margin*2);
  const p = { x: W+PIPE_W, gapY, gap, passed:false };

      // Каждый 2-й уровень — подвижные баррикады (упрощённая версия)
  if (lvl % 2 === 0){
    if (lvl % 4 === 2){                 // уровни 2, 6, 10... — трубы качаются
      p.mode = 'move';
      p.baseY = gapY;
      p.phase = Math.random()*Math.PI*2;
      p.amp = Math.min(22, 10 + Math.floor(lvl/2)*2) * S;  // было до 36 → стало до 22
      p.spd = 0.55 + Math.min(0.6, (lvl-2)*0.04);          // было до 1.8 → стало до 1.15
    } else {                            // уровни 4, 8, 12... — движутся баррикады и меняется ширина зазора
      p.mode = 'pulseMove';
      p.baseY = gapY;
      p.baseGap = gap;
      p.phase = Math.random()*Math.PI*2;
      p.amp = Math.min(12, 5 + Math.floor(lvl/4)*2) * S;
      p.spd = 0.6 + Math.min(0.6, (lvl-4)*0.04);
      p.moveAmp = Math.min(22, 10 + Math.floor(lvl/2)*2) * S;
    }
  }


  const previous = pipes.length ? pipes[pipes.length-1] : null;
  pipes.push(p);
  pipeCount++;
  // Туман теперь появляется редко — примерно в каждом четвёртом подходящем промежутке.
  if (previous){
    const freeSpace = p.x - (previous.x + PIPE_W);
    if (freeSpace > 95*S){
      const midX = previous.x + PIPE_W + freeSpace/2;
      const spawnedHazard = Math.random() < 0.24 ? spawnHazard(midX) : null;
      // Собираемые звёздочки доступны на каждом уровне и дают +5 к игровому счёту.
      // Размещаем их только там, где они не пересекаются с облачками.
      if (pipeCount % 2 === 0){
        const starR = 13*S;
        const minY = p.gapY - p.gap*0.21;
        const maxY = p.gapY + p.gap*0.21;
        let starY = null;
        for (let attempt = 0; attempt < 24; attempt++){
          const candidateY = minY + Math.random()*(maxY-minY);
          const overlapsCloud = hazards.some(h =>
            Math.abs(h.x-midX) < h.rx + starR + 8*S &&
            Math.abs(h.y-candidateY) < h.ry + starR + 8*S
          );
          if (!overlapsCloud){ starY = candidateY; break; }
        }
        if (starY !== null){
          collectibles.push({type:'star', x:midX, y:starY, r:starR, spin:Math.random()*Math.PI*2, taken:false});
        }
      }
    }
  }
}

function spawnHazard(x){
  // Между соседними баррикадами появляется только туман.
  const y = 90*S + Math.random()*Math.max(80*S, H-GROUND_H-180*S);
  const hazard = {type:'cloud', x, y, rx:34*S, ry:27*S,
    phase:0, passed:false};
  hazards.push(hazard);
  return hazard;
}
function hazardHit(h){
  const dx=(plane.x-h.x)/h.rx;
  const dy=(plane.y-h.y)/h.ry;
  return dx*dx+dy*dy < .72;
}

function addScore(n, countsForShop = true){
  score += n;
  if (countsForShop) shopEligibleScore += n;
  if (curLevel < MAX_LEVEL && score >= curLevel*LEVEL_SCORE){
    passLevel = curLevel;
    save.maxLevel = Math.min(MAX_LEVEL, Math.max(save.maxLevel, curLevel+1));
    persist();
    state = 'pass';
    haptic('medium');
  } else if (curLevel >= MAX_LEVEL && score >= WIN_SCORE){
    finishGame(true);
  }
}
function finishGame(win){
  state = win ? 'win' : 'over';
  overTime = performance.now();
  if (!win){ shakeT = 18; spawnCrash(plane.x, plane.y); haptic('heavy'); }

  let earnedStars = Math.floor(shopEligibleScore / 10); // В магазин идут только очки за пройденные баррикады
  save.stars += earnedStars;
  save.games++;
  if (score > save.best) save.best = score;
  if (score > save.weeklyBest) save.weeklyBest = score;
  persist();
  finishGame.earned = earnedStars;
}
  
  // Бонус за золотой скин оставляем, но теперь это бонус к звёздам
  function die(){
  if (save.skin === 'diamond' && !shieldUsed){
    shieldUsed = true; shieldT = 110;
    plane.vy = FLAPV;
    if (plane.y > H - GROUND_H - 80*S) plane.y = H - GROUND_H - 80*S;
    spawnShield(); haptic('medium');
    return;
  }
  if (save.skin === 'cosmic' && !phaseUsed){
    phaseUsed = true; phaseT = 50;
    spawnPhase(); haptic('medium');
    return;
  }
    if (save.skin === 'gold' && !luckyUsed){
    const sk = SKINS[save.skin];
    if (sk.luckyChance){
      luckyUsed = true;                 // шанс потрачен — один раз за уровень
      if (Math.random() < sk.luckyChance){
        haptic('medium');
        plane.vy = FLAPV * 0.8;
        plane.angle = -0.4;
        phaseT = 40;                    // короткая неуязвимость, чтобы вылететь из трубы
        spawnBurst(plane.x, plane.y);
        return;
      }
    }
  }

  finishGame(false);
}

function spawnPhase(){
  for (let i=0;i<14;i++){
    const a = Math.random()*Math.PI*2;
    pushFx({ x: plane.x, y: plane.y, vx: Math.cos(a)*1.6*S, vy: Math.sin(a)*1.6*S,
             life: 26, max: 26, type:'circle', r:2.5*S, col:'220,240,250' });
  }
}

function step(k){
  k_last = k;
  t += k;
  if (shakeT > 0) shakeT -= k;
  if (shieldT > 0) shieldT -= k;
  if (phaseT > 0) phaseT -= k;
  for (const c of clouds){
    c.x -= c.sp*S*k;
    if (c.x < -170*S){ c.x = W + 60*S; c.y = Math.random()*.5; }
  }
  stepWx(k);
  for (let i=fx.length-1; i>=0; i--){
    const p = fx[i];
    if (state !== 'play'){ p.life -= k*.5; }
  }

  if (state !== 'play') return;

  plane.vy += GRAV*k;
  plane.y += plane.vy*k;
  plane.angle = Math.max(-.5, Math.min(1.2, plane.vy/(10*S)*.9));

  if (plane.y < PLANE_R){ plane.y = PLANE_R; plane.vy = Math.max(plane.vy, 0); }
  if (plane.y > H - GROUND_H - PLANE_R){
  if (shieldT > 0){ plane.y = H - GROUND_H - PLANE_R - 30*S; plane.vy = FLAPV; }
  else { die(); return; }
}

  if (Math.floor(t) % 2 === 0) spawnTrail();

  const speed = levelSpeed(curLevel);
  spawnTimer += speed*k;
  if (spawnTimer >= levelSpacing(curLevel)){ spawnTimer -= levelSpacing(curLevel); spawnPipe(curLevel); }

  for (let i=hazards.length-1; i>=0; i--){
    const h=hazards[i];
    h.x -= speed*k;
    const dx=(plane.x-h.x)/h.rx, dy=(plane.y-h.y)/h.ry;
    if (hazardHit(h) && phaseT<=0){ die(); if(state!=='play') return; }
    if (!h.passed && h.x < plane.x-PLANE_R){ h.passed=true; }
    if (h.x < -150*S) hazards.splice(i,1);
  }

  for (let i=collectibles.length-1; i>=0; i--){
    const c = collectibles[i];
    c.x -= speed*k;
    c.spin += .07*k;
    const dx = plane.x-c.x, dy = plane.y-c.y;
    if (dx*dx+dy*dy < (PLANE_R+c.r)* (PLANE_R+c.r)){
      // Звёздочка даёт +5 к игровому счёту, но не учитывается в валюте магазина.
      addScore(5, false);
      haptic('medium');
      for(let n=0;n<8;n++) pushFx({x:c.x,y:c.y,vx:(Math.random()-.5)*3*S,vy:(Math.random()-.5)*3*S,life:18,max:18,type:'star4',r:3*S,col:'255,220,70'});
      collectibles.splice(i,1);
      if (state!=='play') return;
    } else if (c.x < -40*S) collectibles.splice(i,1);
  }

  for (let i=pipes.length-1; i>=0; i--){
    const p = pipes[i];
    if (p.mode === 'move' || p.mode === 'pulseMove'){
      const moveAmp = p.mode === 'pulseMove' ? p.moveAmp : p.amp;
      const ny = p.baseY + Math.sin(t*0.035*p.spd + p.phase) * moveAmp;
      // не даём зазору уйти в потолок или в землю
      p.gapY = Math.max(p.gap/2 + 40*S, Math.min(H - GROUND_H - p.gap/2 - 40*S, ny));
    }
    if (p.mode === 'pulse' || p.mode === 'pulseMove'){
      const ng = p.baseGap + Math.sin(t*0.035*p.spd + p.phase) * p.amp;
      p.gap = Math.max(180*S, ng);
    }
    p.x -= speed*k;
    if (!p.passed && p.x+PIPE_W < plane.x-PLANE_R){ p.passed = true; addScore(1); haptic('light'); if (state!=='play') return; }

    const hitTop = rectHit(p.x, 0, PIPE_W, p.gapY - p.gap/2);
const hitBot = rectHit(p.x, p.gapY + p.gap/2, PIPE_W, H);
if ((hitTop || hitBot) && phaseT <= 0){
  die();
  if (state !== 'play') return;
}
    if (p.x+PIPE_W < -30*S) pipes.splice(i,1);
  }
}

function roundRect(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function button(x,y,w,h,label,action,fill,textColor){
  ctx.fillStyle = fill || '#2AABEE';
  roundRect(x,y,w,h,Math.min(22*S,h/2)); ctx.fill();
  ctx.fillStyle = textColor || '#fff';
  ctx.font = '700 ' + Math.round(Math.max(15*S,13)) + 'px Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x+w/2, y+h/2+1);
  if (action) uiButtons.push({x,y,w,h,action});
}
function panel(x,y,w,h){
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  roundRect(x,y,w,h,18*S); ctx.fill();
  ctx.strokeStyle = 'rgba(42,171,238,.4)'; ctx.lineWidth = 2*S;
  roundRect(x,y,w,h,18*S); ctx.stroke();
}

function drawPipes(){

function translateText(value) {
  let text = String(value);
  if (gameLang === 'ru') return text;
  const dict = LANG_TEXT[gameLang] || {};
  if (dict[text] !== undefined) return dict[text];
  for (const [from, to] of Object.entries(dict).sort((a,b)=>b[0].length-a[0].length)) {
    if (from.length > 2) text = text.split(from).join(to);
  }
  return text;
}
const nativeFillText = ctx.fillText.bind(ctx);
ctx.fillText = function(value, ...args) {
  let text = String(value);
  if (gameLang !== 'ru') {
    const dict = LANG_TEXT[gameLang] || {};
    if (dict[text] !== undefined) text = dict[text];
    else {
      for (const [from, to] of Object.entries(dict).sort((a,b)=>b[0].length-a[0].length)) {
        if (from.length > 2) text = text.split(from).join(to);
      }
    }
  }
  return nativeFillText(text, ...args);
};
function setGameLanguage(lang) {
  gameLang = lang;
  languageOpen = false;
  try { localStorage.setItem('tgPlaneLang', lang); } catch(e) {}
  haptic('light');
}

function drawLevels(){

  const cw = (W - mx*2 - gap*(cols-1)) / cols;
  const ch = 54*S;
  const top = 78*S;
  const totalPages = Math.ceil(MAX_LEVEL/20);
  page = Math.max(0, Math.min(page|0, totalPages-1));

  for (let i=0; i<20; i++){
    const lvl = page*20 + i + 1;
    if (lvl > MAX_LEVEL) break;
    const cx = mx + (i%cols)*(cw+gap);
    const cy = top + Math.floor(i/cols)*(ch+gap);
    const unlocked = lvl <= save.maxLevel;
    if (unlocked){
      const th = themeOf(lvl);
      ctx.fillStyle = th.skyTop;
      roundRect(cx,cy,cw,ch,10*S); ctx.fill();
      ctx.strokeStyle = lvl === save.maxLevel ? '#ff9a3c' : 'rgba(255,255,255,.6)';
      ctx.lineWidth = 2*S;
      roundRect(cx,cy,cw,ch,10*S); ctx.stroke();
      ctx.fillStyle = '#0b3a55';
      ctx.font = '700 ' + Math.round(20*S) + 'px Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(lvl, cx+cw/2, cy+ch/2-6*S);
      ctx.font = Math.round(10*S) + 'px Arial, sans-serif';
      ctx.fillStyle = 'rgba(11,58,85,.7)';
      ctx.fillText(translateText(th.name), cx+cw/2, cy+ch/2+11*S);
      const lx = cx, ly = cy, lw2 = cw, lh2 = ch;
      uiButtons.push({x:lx,y:ly,w:lw2,h:lh2,action:(l=>()=>showBriefing(l))(lvl)});
    } else {
      ctx.fillStyle = 'rgba(120,130,140,.55)';
      roundRect(cx,cy,cw,ch,10*S); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = Math.round(16*S) + 'px Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🔒 ' + lvl, cx+cw/2, cy+ch/2);
    }
  }

  const bw = 64*S, bh = 40*S, by = H - GROUND_H - bh - 14*S;
  if (page > 0) button(16*S, by, bw, bh, '←', ()=>{ page--; }, '#1f8fc9');
  ctx.fillStyle = '#0b4a6f';
  ctx.font = '700 ' + Math.round(16*S) + 'px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText((page+1) + ' / ' + totalPages, W/2, by + bh/2 + 6*S);
  if (page < totalPages-1) button(W - bw - 16*S, by, bw, bh, '→', ()=>{ page++; }, '#1f8fc9');
}

function drawShop(){
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#0b4a6f';
  ctx.font = '800 ' + Math.round(Math.min(30*S,26)) + 'px Arial, sans-serif';
  ctx.fillText('Магазин', W/2, 52*S);
  ctx.font = '700 ' + Math.round(Math.max(15*S,13)) + 'px Arial, sans-serif';
  ctx.fillText('⭐ ' + save.stars, W/2, 78*S);
  button(12*S, 26*S, 92*S, 34*S, '← Меню', toMenu, '#5b7a8c');

  const w = Math.min(380*S, W - 24*S), x = (W - w)/2;
  const rowH = 84*S;
  let y = 96*S;
  const btnW = Math.min(112*S, w*.32), btnH = 40*S;

  for (const id of ['classic','gold','diamond','cosmic']){
    const sk = SKINS[id];
    const owned = save.owned[id], equipped = save.skin === id;
    panel(x, y, w, rowH);

    const spr = planeSprite(id);
    ctx.drawImage(spr, x+8*S, y+rowH/2-26*S, 52*S, 52*S);

    const tx = x + 66*S;
    const tw = w - 66*S - btnW - 20*S;
    ctx.fillStyle = '#0b4a6f';
    ctx.font = '700 ' + Math.round(Math.max(16*S,14)) + 'px Arial, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(sk.name, tx, y + 30*S, tw);

    ctx.fillStyle = '#5b7a8c';
    ctx.font = Math.round(Math.max(12*S,10)) + 'px Arial, sans-serif';
    wrapText(translateText(sk.bonus), tx, y + 50*S, tw, Math.round(15*S));

    const bx = x + w - btnW - 10*S, by = y + (rowH - btnH)/2;
    if (equipped){
      ctx.fillStyle = '#7bbd8d';
      roundRect(bx, by, btnW, btnH, 18*S); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '700 ' + Math.round(Math.max(14*S,12)) + 'px Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Выбран', bx+btnW/2, by+btnH/2+1);
    } else if (owned){
      button(bx, by, btnW, btnH, 'Выбрать', (i=>()=>buySkin(i))(id), '#1f8fc9');
    } else {
      const afford = save.stars >= sk.price;
      ctx.fillStyle = afford ? '#2fbf6b' : '#9aa7ae';
      roundRect(bx, by, btnW, btnH, 18*S); ctx.fill();

      /* цена — по центру кнопки */
      ctx.fillStyle = '#fff';
      ctx.font = '700 ' + Math.round(Math.max(14*S,12)) + 'px Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(sk.price), bx + btnW/2, by + btnH/2 + 1);

      /* звезда Telegram — справа */
      drawTelegramStar(bx + btnW - 16*S, by + btnH/2, 9*S);

      uiButtons.push({x:bx, y:by, w:btnW, h:btnH, action:(i=>()=>buySkin(i))(id)});
    }
    y += rowH + 10*S;
  }
}
function wrapText(text, x, y, maxW, lineH){
  const words = text.split(' ');
  let line = '', yy = y;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (const wd of words){
    const test = line ? line + ' ' + wd : wd;
    if (ctx.measureText(test).width > maxW && line){
      ctx.fillText(line, x, yy);
      line = wd; yy += lineH;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
}

function drawRecords(){
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#0b4a6f';
  ctx.font = '800 ' + Math.round(Math.min(30*S,26)) + 'px Arial, sans-serif';
  ctx.fillText('Рекорды', W/2, 52*S);
  button(12*S, 26*S, 92*S, 34*S, '← Меню', toMenu, '#5b7a8c');

  const w = Math.min(340*S, W - 32*S), x = (W - w)/2;

  /* --- Таблица: имя игрока и недельный рекорд --- */
  const th = 60*S;                      // высота таблицы
  panel(x, 90*S, w, th);

  // Шапка
  ctx.font = Math.round(Math.max(11*S,9)) + 'px Arial, sans-serif';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#5b7a8c';
  ctx.textAlign = 'left';
  ctx.fillText('ИГРОК', x+16*S, 90*S + 18*S);
  ctx.textAlign = 'right';
  ctx.fillText('НЕДЕЛЬНЫЙ РЕКОРД', x+w-16*S, 90*S + 18*S);

  // Разделительная линия
  ctx.strokeStyle = 'rgba(42,171,238,.35)';
  ctx.lineWidth = 1.5*S;
  ctx.beginPath();
  ctx.moveTo(x+12*S, 90*S + 24*S);
  ctx.lineTo(x+w-12*S, 90*S + 24*S);
  ctx.stroke();

  // Строка с данными
  ctx.fillStyle = '#0b4a6f';
  ctx.font = '700 ' + Math.round(Math.max(16*S,14)) + 'px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(save.playerName, x+16*S, 90*S + 46*S, w - 150*S);   // имя
  ctx.textAlign = 'right';
  ctx.fillStyle = '#2fbf6b';
  ctx.fillText(String(save.weeklyBest), x+w-16*S, 90*S + 46*S);    // рекорд

  // Тап по имени — сменить (только в браузере; в Telegram имя берётся из профиля)
  if (!tg){
    ctx.fillStyle = '#5b7a8c';
    ctx.font = Math.round(Math.max(10*S,8)) + 'px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('коснитесь, чтобы сменить имя', x+16*S, 90*S + th - 4*S);
    uiButtons.push({x, y:90*S, w, h:th, action:changePlayerName});
  }

  /* --- Обычные строки статистики ниже --- */
  const y0 = 90*S + th + 14*S, rh = 52*S;
  const rows = [
    ['Лучший счёт', save.best],
    ['Открыто уровней', save.maxLevel + ' / ' + MAX_LEVEL],
    ['Игр сыграно', save.games],
    ['Звёзды', '⭐ ' + save.stars],
    ['Самолётик: Эра приключений', SKINS[save.skin].name]
  ];
  for (let i=0;i<rows.length;i++){
    panel(x, y0 + i*(rh+8*S), w, rh);
    ctx.fillStyle = '#5b7a8c';
    ctx.font = Math.round(Math.max(14*S,12)) + 'px Arial, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(rows[i][0], x+16*S, y0 + i*(rh+8*S) + rh/2);
    ctx.fillStyle = '#0b4a6f';
    ctx.font = '700 ' + Math.round(Math.max(15*S,13)) + 'px Arial, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(String(rows[i][1]), x+w-16*S, y0 + i*(rh+8*S) + rh/2);
  }
}

function drawPause(){
  ctx.fillStyle = 'rgba(10,30,50,.45)'; ctx.fillRect(0,0,W,H);
  const pw = Math.min(300*S, W-40), ph = 170*S;
  const px = W/2-pw/2, py = H/2-ph/2;
  panel(px, py, pw, ph);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#0b4a6f';
  ctx.font = '800 ' + Math.round(26*S) + 'px Arial, sans-serif';
  ctx.fillText('Пауза', W/2, py + 44*S);
  const bw = Math.min(200*S, pw-40), bh = 42*S;
  button(W/2-bw/2, py+58*S, bw, bh, 'Продолжить', ()=>{ state='play'; });
  button(W/2-bw/2, py+58*S+bh+10*S, bw, bh, 'В меню', toMenu, '#5b7a8c');
}

function drawPass(){
  ctx.fillStyle = 'rgba(10,30,50,.45)'; ctx.fillRect(0,0,W,H);
  const pw = Math.min(320*S, W-40), ph = 220*S;
  const px = W/2-pw/2, py = H/2-ph/2;
  panel(px, py, pw, ph);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#2fbf6b';
  ctx.font = '800 ' + Math.round(26*S) + 'px Arial, sans-serif';
  ctx.fillText('Уровень ' + passLevel + ' пройден!', W/2, py + 44*S);
  ctx.fillStyle = '#0b4a6f';
  ctx.font = '700 ' + Math.round(20*S) + 'px Arial, sans-serif';
  ctx.fillText('Очки: ' + score, W/2, py + 78*S);
  const bw = Math.min(220*S, pw-40), bh = 44*S;
  button(W/2-bw/2, py+100*S, bw, bh, 'Уровень ' + (passLevel+1), ()=>{
  startGame(passLevel + 1);
});
  button(W/2-bw/2, py+100*S+bh+12*S, bw, bh, 'В меню', toMenu, '#5b7a8c');
}

function drawOver(){
  ctx.fillStyle = 'rgba(10,30,50,.45)'; ctx.fillRect(0,0,W,H);
  const pw = Math.min(320*S, W-40), ph = 270*S;
  const px = W/2-pw/2, py = Math.max(10*S, H/2 - ph/2);
  panel(px, py, pw, ph);

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = '#d64545';
  ctx.font = '800 ' + Math.round(30*S) + 'px Arial, sans-serif';
  ctx.fillText('Упс!', W/2, py + 42*S);

  ctx.fillStyle = '#0b4a6f';
  ctx.font = '700 ' + Math.round(20*S) + 'px Arial, sans-serif';
  ctx.fillText('Очки: ' + score, W/2, py + 74*S);
  ctx.fillText('Рекорд: ' + save.best, W/2, py + 100*S);

  ctx.fillStyle = '#2fbf6b';

  const bw = Math.min(200*S, pw - 40), bh = 44*S;
  button(W/2 - bw/2, py + 148*S, bw, bh, 'Играть ещё', ()=>startGame(lastStart));
  button(W/2 - bw/2, py + 202*S, bw, bh, 'В меню', toMenu, '#5b7a8c');
}
function drawWin(){
  ctx.fillStyle = 'rgba(10,30,50,.45)'; ctx.fillRect(0,0,W,H);
  const pw = Math.min(320*S, W-40), ph = 220*S;
  const px = W/2-pw/2, py = H/2-ph/2;
  panel(px, py, pw, ph);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#2fbf6b';
  ctx.font = '800 ' + Math.round(30*S) + 'px Arial, sans-serif';
  ctx.fillText('Победа! 🏆', W/2, py+48*S);
  ctx.fillStyle = '#0b4a6f';
  ctx.font = '700 ' + Math.round(21*S) + 'px Arial, sans-serif';
  ctx.fillText('Все ' + MAX_LEVEL + ' уровней пройдены!', W/2, py+88*S);
  ctx.fillText('Очки: ' + score + '   Рекорд: ' + save.best, W/2, py+118*S);
  const bw = Math.min(200*S, pw-40), bh = 42*S;
  button(W/2-bw/2, py+ph-56*S, bw, bh, 'В меню', toMenu);
}

/* ============ Кадр ============ */
function render(){
  uiButtons = [];
  ctx.save();
  if (shakeT > 0) ctx.translate((Math.random()-.5)*8*S, (Math.random()-.5)*8*S);

  drawSky();
  drawBgLayers();
  drawWx();

  const world = state==='play' || state==='pause' || state==='over' || state==='pass' || state==='win';
  if (world) { drawPipes(); drawHazards(); drawCollectibles(); }
  drawGround();

  if (world) drawPlane(plane.x, plane.y, plane.angle, 1);
  if (state === 'menu') drawPlane(W/2, H*.30 + Math.sin(t*.06)*10*S, Math.sin(t*.04)*.12, 1.4);

  drawFx();
  drawHUD();

  if (state === 'menu') drawMenu();
  if (state === 'levels') drawLevels();
  if (state === 'briefing') drawBriefing();
  if (state === 'records') drawRecords();
  if (state === 'pause') drawPause();
  if (state === 'pass') drawPass();
  if (state === 'over') drawOver();
  if (state === 'win') drawWin();
  if (state === 'shop') drawShop();
  if (state === 'topup') drawTopUp();

  ctx.restore();
}

let last = performance.now();
function loop(now){
  const k = Math.min((now-last)/16.667, 3);
  last = now;
  try {
    step(k);
    render();
  } catch(err){
    console.error('Ошибка кадра:', err);
    uiButtons = [];
    state = 'menu';
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
